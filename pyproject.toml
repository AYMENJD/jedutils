[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "Jedutils"
dynamic = ["version"]
description = "Jedutils is a Python utilities package that provides a collection of useful helper functions."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AYMEN A", email = "let.me.code.safe@gmail.com" }]
dependencies = []
keywords = [
    "utilities",
    "tools",
    "library",
    "helper",
    "functions",
    "development",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Source = "https://github.com/AYMENJD/jedutils"
Tracker = "https://github.com/AYMENJD/jedutils/issues"

[project.optional-dependencies]
all = ["redis", "aiohttp"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["jedutils", "jedutils.*"]
namespaces = false

[tool.setuptools.dynamic]
version = { attr = "jedutils.__version__" }
